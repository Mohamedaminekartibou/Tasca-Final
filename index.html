<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llistat d'Activitats</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <aside class="lado">
    <h2>Menú</h2>
    <nav>
      <ul>
        <li><a href="index.html">Llistat d'Activitats</a></li>
        <li><a href="crear-tasca.html">Crear Tasca</a></li>
        <li><a href="categories.html">Gestió de Categories</a></li>
      </ul>
    </nav>
  </aside>

  <section class="contenido">
    <h1>Llistat d'Activitats</h1>

    <div class="top-bar">
      <button id="btnNova">+ Nova Tasca</button>
      <div class="import-bar">
        <input type="text" id="inputFitxer" placeholder="nom del arxiu (ex: activitats_001.json)">
        <button id="btnPujar">Pujar</button>
        <button id="btnEsborrar" title="Esborra totes les tasques">⟳Reset⟳</button>
      </div>
    </div>

    <h2>Tasques pendents</h2>
    <ul id="pendents"></ul>

    <h2>Tasques acabades</h2>
    <ul id="acabades"></ul>

    <h2>Gràfic de tasques realitzades</h2>
    <div class="chart-container">
      <canvas id="grafica"></canvas>
    </div>
  </section>

  <script src="js/storage.js"></script>
  <script src="js/models.js"></script>
  <script src="js/grafics.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
